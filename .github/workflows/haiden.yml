name: haiden

on:
  push:
    branches: [main]
    paths:
      - "haiden/**"
      - "viewer/**"
      - ".github/workflows/haiden.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # One job per model variant, in parallel (A-1 ≈ 15 min, A-2v1 ≈ 25 min, A-2 ver2 ≈ 35 min with
  # texture bake + 6 final renders). A-1 / A-2v1 are frozen (ver1); A-2 = 拝殿A-2 ver2 (3 finishes).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [A-1, A-2v1, A-2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: haiden/blender/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bpy and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libxkbcommon0 fonts-noto-cjk
          python -m pip install -r haiden/blender/requirements.txt
          npm install --no-save --prefix "$RUNNER_TEMP/gt" @gltf-transform/cli@4
          echo "$RUNNER_TEMP/gt/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build model (${{ matrix.variant }})
        run: python haiden/blender/build_haiden.py --variant ${{ matrix.variant }} --out haiden/out/${{ matrix.variant }}

      - name: Render (${{ matrix.variant }})
        env:
          HAIDEN_QUALITY: final
        run: python haiden/blender/render.py --out haiden/out/${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: haiden-out-${{ matrix.variant }}
          path: |
            haiden/out/${{ matrix.variant }}/haiden_web*.glb
            haiden/out/${{ matrix.variant }}/stats.json
            haiden/out/${{ matrix.variant }}/renders/
          if-no-files-found: error

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: haiden-out-*
          path: dl

      - name: Assemble _site
        run: |
          set -eu
          mkdir -p _site/app _site/models _site/renders
          if [ -f viewer/quick.html ]; then cp viewer/quick.html _site/index.html; fi
          if [ -f viewer/index.html ]; then
            cp viewer/index.html _site/app/index.html
            if [ ! -f _site/index.html ]; then cp viewer/index.html _site/index.html; fi
          fi
          # other viewer assets (exclude html already placed and tests)
          if [ -d viewer ]; then
            (cd viewer && find . -type f ! -name 'index.html' ! -name 'quick.html' ! -path './test/*' ! -name '*.md' -print0) |
              while IFS= read -r -d '' f; do mkdir -p "_site/$(dirname "$f")"; cp "viewer/$f" "_site/$f"; done
          fi
          # per-variant models / stats / renders
          for d in dl/haiden-out-*; do
            id="${d#dl/haiden-out-}"
            mkdir -p "_site/models/$id" "_site/renders/$id"
            cp "$d"/haiden_web*.glb "_site/models/$id/"
            cp "$d/stats.json" "_site/models/$id/stats.json"
            if compgen -G "$d/renders/*.png" > /dev/null; then cp "$d"/renders/*.png "_site/renders/$id/"; fi
          done
          # models/index.json (newest first) + backward-compatible latest copies
          python3 - <<'PY'
          import json, os, re
          ids = [i for i in os.listdir("_site/models") if os.path.isfile(f"_site/models/{i}/haiden_web.glb")]
          st_of = {i: json.load(open(f"_site/models/{i}/stats.json", encoding="utf-8")) for i in ids}
          # newest first: stats "seq" (A-2 ver2 = 3, A-2v1 = 2, A-1 = 1), then natural id order
          nat = lambda s: [int(x) if x.isdigit() else x for x in re.split(r"(\d+)", s)]
          ids = sorted(ids, key=lambda i: (st_of[i].get("seq", 0), nat(i)), reverse=True)
          idx = []
          for i in ids:
              st = st_of[i]
              e = {"id": i, "name": st.get("name", i), "glb": f"models/{i}/haiden_web.glb", "stats": f"models/{i}/stats.json"}
              e["finishes"] = st.get("finishes", [{"id": "nuri", "name": "丹塗"}])
              e["finish_mode"] = st.get("finish_mode", "single")
              if st.get("finish_mode") == "separate":
                  e["finish_glbs"] = {k: f"models/{i}/{os.path.basename(v)}" for k, v in st.get("finish_glbs", {}).items()}
              idx.append(e)
          json.dump(idx, open("_site/models/index.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(idx, ensure_ascii=False, indent=2))
          latest = ids[0]
          import shutil
          shutil.copy(f"_site/models/{latest}/haiden_web.glb", "_site/models/haiden_web.glb")
          shutil.copy(f"_site/models/{latest}/stats.json", "_site/models/stats.json")
          PY
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
